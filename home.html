<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">

<title>ホーム</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#f5f5f5;
}

header{
  background:#111;
  color:#fff;
  text-align:center;
  padding:12px;
  font-weight:600;
  font-size:20px;
  font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
}

.container{
  max-width:520px;
  margin:0 auto;
  padding:15px;
}

/* ボタン */
.btn{
  display:block;
  width:100%;
  padding:15px;
  margin-bottom:10px;
  border:none;
  border-radius:10px;
  font-size:16px;
  color:#fff;
  text-align:left;
}

/* 色分け */
.btn-1{background:#007aff;}
.btn-2{background:#34c759;}
.btn-3{background:#ff9500;}
.btn-4{background:#af52de;}
.btn-5{background:#ff2d55;}

.btn-sub{background:#8e8e93;}
</style>
</head>

<body>

<header>漫画構図ツール</header>

<div class="container">

<h3>メイン機能</h3>

<button class="btn btn-1" onclick="go('composition.html')">
① 構図管理
</button>

<button class="btn btn-2" onclick="go('tag.html')">
② タグ付け
</button>

<button class="btn btn-3" onclick="go('layout.html')">
③ レイアウト管理
</button>

<button class="btn btn-4" onclick="go('layout-setting.html')">
④ レイアウト設定
</button>

<button class="btn btn-5" onclick="go('generate.html')">
⑤ 構図生成
</button>

<h3>設定・管理</h3>

<button class="btn btn-sub" onclick="go('tag-manage.html')">
タグ管理（追加・削除）
</button>

</div>

<script>

function go(url){
  location.href=url;
}

</script>

<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
