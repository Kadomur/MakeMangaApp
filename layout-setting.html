<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">

<title>レイアウト設定</title>
<style>

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:#f5f5f5;
  font-size:17px;
}

header{
  background:#111;
  color:#fff;
  text-align:center;
  padding:12px;
  font-weight:600;
  font-size:20px;
  font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
}

.container{
  max-width:520px;
  margin:0 auto;
  padding:15px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:16px;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:10px;
}

input{width:100px;margin:10px;}

#rows{
  font-size:16px;
  padding:6px 10px;
  border-radius:8px;
}

#colsArea select{
  font-size:16px;
  padding:6px 10px;
  border-radius:8px;
}

.card > div:first-of-type{
  margin-bottom:15px;
}

#img{
  display:block;
  margin:0 auto 10px auto;
}

.btn-home{
  background:#8e8e93;
  color:#fff;
  border:none;
  border-radius:10px;
  padding:8px 12px;
  font-size:14px;
  margin-bottom:15px;
}

.btn-blue,
.btn-orange{
  color:#fff;
  border:none;
  border-radius:10px;
  padding:8px 12px;
  cursor:pointer;
  font-weight:600;
  font-size:14px;
}

.btn-blue{ background:#007aff; }
.btn-orange{ background:#ff9500; }

.btn-green:hover{ opacity:0.85; }
.btn-blue:hover{ opacity:0.85; }
.btn-red:hover{ opacity:0.85; }
.btn-orange:hover{ opacity:0.85; }

.btn-green:active,
.btn-blue:active,
.btn-red:active,
.btn-orange:active{
  transform:none;
}

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0px 0px 15px;
}

/* 既存 */
.btn-home{
  background:#8e8e93;
  color:#fff;
  border:none;
  border-radius:10px;
  padding:8px 12px;
  font-size:14px;
  margin-bottom:15px;
}

/* 追加（ここがポイント） */
.btn-sub{
  background:#e5e5ea;   /* ←薄グレー（iOSっぽい） */
  color:#333;
  border:none;
  border-radius:8px;
  padding:6px 10px;
  font-size:13px;
}

/* 押したとき */
.btn-sub:active{
  transform:none;
}

</style>
</head>

<body>

<header>レイアウト設定</header>

<div class="container">

<div class="top-bar">
  <button class="btn-home" onclick="goHome()">←ホーム</button>
  <button class="btn-sub" onclick="goLayout()">一覧へ</button>
</div>

<div class="card">

<img id="img" width="200">

<div>
段数 
<select id="rows">
  <option value="1">1段</option>
  <option value="2">2段</option>
  <option value="3">3段</option>
  <option value="4">4段</option>
  <option value="5">5段</option>
</select>
</div>

<div id="colsArea"></div>

<div class="row">
  <button class="btn-blue" onclick="saveLayout()">保存</button>
</div>

</div>

</div>

<script>
function goLayout(){
  location.href = "layout.html"; // ←③に戻る
}

function load(){return JSON.parse(localStorage.getItem("layouts"))||[];}
function save(d){localStorage.setItem("layouts",JSON.stringify(d));}

/* ▼修正：target取得ロジック */
let data = load();

const id = localStorage.getItem("targetLayout");

let target = id
  ? data.find(l => l.id == id)
  : data.find(l => !l.rows);

img.src=target.src;

// ----------------------
// 入力UI生成
// ----------------------

rows.addEventListener("change", renderCols);
rows.addEventListener("input", renderCols);

function renderCols(){
  const n=parseInt(rows.value)||0;
  colsArea.innerHTML="";

  for(let i=0;i<n;i++){

    const wrap=document.createElement("div");
    wrap.style.display="flex";
    wrap.style.alignItems="center";
    wrap.style.marginBottom="8px";

    const label=document.createElement("span");
    label.textContent=(i+1)+"段目";
    label.style.marginRight="10px";

    const select=document.createElement("select");

    for(let j=1;j<=5;j++){
      const opt=document.createElement("option");
      opt.value=j;
      opt.textContent=j+"コマ";
      select.appendChild(opt);
    }

    wrap.appendChild(label);
    wrap.appendChild(select);

    colsArea.appendChild(wrap);
  }
}

// ----------------------
// 保存
// ----------------------

function saveLayout(){

  const checkR = parseInt(rows.value)||0;
  const checkInputs = colsArea.querySelectorAll("select");

  if(checkR === 0 || checkInputs.length === 0){
    alert("段数/コマ数を設定してください");
    return;
  }

  const r=parseInt(rows.value)||0;
  const inputs=colsArea.querySelectorAll("input, select");

  const cols=[...inputs].map(i=>parseInt(i.value)||1);

  const rowsData = cols.map(c=>{
    return Array(c).fill(1);
  });

  const idx=data.findIndex(l=>l.id==id);

  data[idx].rows = rowsData;

  delete data[idx].cols;

  save(data);

  alert("保存しました");

  const next = data.find(l => !l.rows);

  if(next){
    localStorage.setItem("targetLayout", next.id);
    location.reload();
    return;
  }

  img.style.display="none";

  const msg=document.createElement("div");
  msg.textContent="未設定レイアウトはありません";
  msg.style.textAlign="center";
  msg.style.marginTop="20px";
  msg.style.color="#888";

  img.after(msg);
}

// ----------------------

function goBack(){
  location.href="layout.html";
}

function goHome(){
  location.href="home.html";
}

</script>

<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
