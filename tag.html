<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">

<title>② タグ付け ver12</title>

<style>
body{
  font-size:18px;
  padding:0px;
}
#area{
  padding:0 12px; /* ▼修正：ここに移動 */
}

img{
  width:60%;
  display:block;
  margin:0 auto 10px; /* ▼修正：中央寄せ */
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:#f5f5f5;
  font-size:17px;
}

header{
  background:#111;
  color:#fff;
  text-align:center;
  padding:12px;
  font-weight:600;
  font-size:20px;
  font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
}

.btn-home{
  background:#8e8e93;
  color:#fff;
  border:none;
  border-radius:10px;
  padding:8px 12px;
  font-size:14px;
  margin-bottom:15px;
  margin:10px 12px 15px; /* ▼修正：上にも余白追加 */
}

.container{
  max-width:520px;
  margin:0 auto;
  padding:12px;
}

input{
  font-size:16px;
  width:40%;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:16px;
  margin-bottom:16px;
}

.group{
  background:#fff;
  border-radius:12px;
  padding:12px;
  margin-bottom:10px;
}
.group.required h3{color:red;}

.tag{
  background:#b3b3b3;
  color:#fff;
  border:none;
  border-radius:3px;
  padding:6px 15px;
  font-size:17px;
  margin-bottom:0px;
  cursor:pointer;
}
.tag.active{
  background:#26aa40;
  color:#fff;
}

/* 役割 */
.role-btn{
  background:#b3b3b3;
  color:#fff;
  border:none;
  border-radius:3px;
  padding:6px 15px;
  font-size:17px;
  margin-bottom:15px;
  cursor:pointer;
}
.role-btn.active{
  background:#ff9933;
  color:#fff;
  border:none;
  border-radius:3px;
  padding:6px 15px;
  font-size:17px;
  margin-bottom:15px;
}

#roleArea{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

/* アコーディオン */
.accordion{margin-top:10px;}
.accordion-header{
  font-size:19px;
  font-weight:600;
  cursor:pointer;
  margin-bottom:8px;
}

.accordion-content{
  display:none;
  margin-top:5px;

  /* ▼追加 */
  flex-wrap:wrap;
  gap:8px;
}

h3{
  margin-top:0;
  margin-bottom:12px; /* ▼修正：余白縮小 */
}

.btn-green,
.btn-blue,
.btn-red,
.btn-gray{
  color:#fff;
  border:none;
  border-radius:10px;
  padding:8px 12px;
  cursor:pointer;
  font-weight:600;
  font-size:14px;
}

.btn-green{ background:#4cd964; }
.btn-blue{ background:#007aff; }
.btn-red{ background:#ff6b6b; }
.btn-gray{ background:#bcbcbd; }

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0px 0px 15px;
}

/* 既存 */
.btn-home{
  background:#8e8e93;
  color:#fff;
  border:none;
  border-radius:10px;
  padding:8px 12px;
  font-size:14px;
  margin-bottom:15px;
  margin:10px 12px 15px; /* ▼修正：上にも余白追加 */
}

/* 追加（ここがポイント） */
.btn-sub{
  background:#e5e5ea;   /* ←薄グレー（iOSっぽい） */
  color:#333;
  border:none;
  border-radius:8px;
  padding:6px 10px;
  font-size:13px;
}

/* 押したとき */
.btn-sub:active{
  transform:scale(0.95);
}

/* 余白 */
.spacer{height:20px;}
</style>

</head>
<body>

<header>タグ付け</header>

<div class="top-bar">
  <button class="btn-home" onclick="goHome()">←ホーム</button>
  <button class="btn-sub" onclick="goComposition()">一覧へ</button>
</div>

<div id="area"></div>

<script>
function goComposition(){
  location.href = "composition.html";
}

window.onload = () => {
  window.scrollTo(0, 0);
};

// ----------------------
// タグ定義（tag-manageと連動）
// ----------------------

function loadTagMaster(){
  return JSON.parse(localStorage.getItem("tags")) || [];
}

// ----------------------
// データ
// ----------------------

function load(){
  return JSON.parse(localStorage.getItem("compositions")) || [];
}
function save(d){
  localStorage.setItem("compositions", JSON.stringify(d));
}

let data=load();
let id = Number(localStorage.getItem("targetComposition")); // ←そのままでOK（変更なしでも可）
const fromPreview = localStorage.getItem("fromPreview"); // ←追加

let item;

if(fromPreview){
  item = data.find(l => l.id == id);
}else{
  item = data.find(l => l.id == id && (!l.tags || l.tags.length === 0));
}

if(!item){
  const next = data.find(l => !l.tags || l.tags.length === 0);

  if(next){
    localStorage.setItem("targetComposition", next.id);
    location.reload();
  }else{

    // ▼修正：UI表示に変更（alert廃止）
    const area = document.getElementById("area");

    area.innerHTML = `
      <div style="
        text-align:center;
        padding:40px 20px;
        font-size:18px;
        color:#555;
      ">
        タグが未設定の画像はありません
      </div>
    `;
  }
}

// ----------------------
// UI
// ----------------------

if(item){

const area=document.getElementById("area");

area.innerHTML=`<img src="${item.src}">`;

const note = document.createElement("div");
note.textContent = "※赤字タグは必須選択";
note.style.textAlign = "right";
note.style.fontSize = "13px";
note.style.color = "#666";
note.style.marginBottom = "10px";

area.appendChild(note);

const tagMaster = loadTagMaster();

// ----------------------
// 通常タグ（動的）
// ----------------------

tagMaster.forEach(group=>{

  // 特殊・GBはあとで
  if(group.name==="特殊コマ" || group.name==="GB機能") return;

  const div=document.createElement("div");
  div.className="group"+(group.required?" required":"");

  // 親は縦にする（削除 or 変更）
  div.style.display = "block";

  // ▼タグ用ラッパー追加
  const tagWrap = document.createElement("div");
  tagWrap.style.display = "flex";
  tagWrap.style.flexWrap = "wrap";
  tagWrap.style.gap = "8px";
  tagWrap.style.marginTop = "4px";

  const title=document.createElement("h3");
  title.textContent = group.name + (group.single ? "" : "（複数可）"); // ▼修正
  div.appendChild(title);

  group.list.forEach(tag=>{
    const btn=document.createElement("div");
    btn.className="tag";
    btn.textContent=tag;

    if(item.tags && item.tags.includes(tag)){
      btn.classList.add("active");
    }

    btn.onclick=()=>{
      if(group.single){

  const isActive = btn.classList.contains("active"); // ▼追加

  // ▼必須の場合（絶対1つ必要）
  if(group.required){
    [...div.querySelectorAll(".tag")].forEach(t=>t.classList.remove("active"));
    btn.classList.add("active");
    return;
  }

  // ▼任意の場合（OFF可能）
  [...div.querySelectorAll(".tag")].forEach(t=>t.classList.remove("active"));

  if(!isActive){
    btn.classList.add("active");
  }

}else{
        btn.classList.toggle("active");
      }
    };

    tagWrap.appendChild(btn);
  });

  div.appendChild(tagWrap);
  area.appendChild(div);

  if(group.name==="環境"){
    const sp=document.createElement("div");
    sp.className="spacer";
    area.appendChild(sp);
  }
});

// ----------------------
// 特殊コマ
// ----------------------

const special = tagMaster.find(g=>g.name==="特殊コマ");
if(special){
  area.appendChild(createAccordion("特殊コマ", special.list));
}

// ----------------------
// GB機能
// ----------------------

const gb = tagMaster.find(g=>g.name==="GB機能");
if(gb){
  area.appendChild(createAccordion("GB機能", gb.list));
}

// ----------------------
// 役割
// ----------------------

// ▼① 区切り線
const hr = document.createElement("hr");
area.appendChild(hr);

// ▼② roleDivはここだけ
const roleDiv = document.createElement("div");
roleDiv.className = "group";

roleDiv.innerHTML = `
<h3>役割（1つ選択）</h3>

<div id="roleArea">
  <div class="role-btn" data-role="emotion">感情</div>
  <div class="role-btn" data-role="relationship">関係</div>
  <div class="role-btn" data-role="situation">状況</div>
</div>
`;

// ▼③ 保存
const saveBtn = document.createElement("button");
saveBtn.className = "btn-blue";
saveBtn.textContent = "保存";
saveBtn.onclick = saveData;

area.appendChild(roleDiv);
area.appendChild(saveBtn);

// ▼追加：最下部スクロール余白
const bottomSpace = document.createElement("div");
bottomSpace.style.height = "70px"; // ←ここで調整（100〜150くらいが良い）
area.appendChild(bottomSpace);

const roleBtns=document.querySelectorAll(".role-btn");

if(item.role){
  roleBtns.forEach(b=>{
    if(b.dataset.role===item.role){
      b.classList.add("active");
    }
  });
}

roleBtns.forEach(btn=>{
  btn.onclick=()=>{
    roleBtns.forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
  };
});

}

// ----------------------
// アコーディオン
// ----------------------

function createAccordion(title, tags){

  const wrap=document.createElement("div");
  wrap.className="accordion group"; // ←追加

  const header=document.createElement("div");
  header.className="accordion-header";
  header.textContent="▶ " + title; // 特殊コマ、GB機能未選択時の表示

  const content=document.createElement("div");
  content.className="accordion-content";

  header.onclick=()=>{
  const isOpen = getComputedStyle(content).display === "flex";

  if(isOpen){
    content.style.display = "none";
    header.textContent = "▶ " + title;
  }else{
    content.style.display = "flex";
    header.textContent = "▼ " + title;
  }
};

  tags.forEach(tag=>{
    const btn=document.createElement("div");
    btn.className="tag";
    btn.textContent=tag;

    if(item.tags && item.tags.includes(tag)){
      btn.classList.add("active");
    }

    btn.onclick=()=>{
      btn.classList.toggle("active");
    };

    content.appendChild(btn);
  });

  wrap.appendChild(header);
  wrap.appendChild(content);

  return wrap;
}

// ----------------------
// 保存（必須チェックあり）
// ----------------------

function saveData(){

const tagMaster = loadTagMaster(); // ▼修正：一番上に移動
  
const activeTags=[...document.querySelectorAll(".tag.active")]
  .map(t=>t.textContent);

// ▼修正：特殊コマ・GB機能のタグを除外
const filteredTags = activeTags.filter(tag=>{
  return !tagMaster.some(g => 
    (g.name==="特殊コマ" || g.name==="GB機能") &&
    g.list.includes(tag)
  );
});

  const roleBtn=document.querySelector(".role-btn.active");

  let missing=[];

  tagMaster.forEach(g=>{

  // ▼修正：特殊コマ・GB機能は必須チェックから除外
  if(g.name==="特殊コマ" || g.name==="GB機能") return;

  if(!g.required) return;

  const has = filteredTags.some(tag => g.list.includes(tag));

  if(!has){
    missing.push(g.name);
  }
});

  if(missing.length>0){
    alert("赤字の必須タグを選択してください\n" + missing.join(" / "));
    return;
  }

  if(!roleBtn){
    alert("役割を選択してください");
    return;
  }

  item.tags=activeTags;
  item.role=roleBtn.dataset.role;

save(data);

alert("保存しました");

// ▼ここに入れる（最優先）
if(localStorage.getItem("fromPreview")){
  localStorage.removeItem("fromPreview");
  location.href="composition.html";
  return; // ←これが超重要
}

// ▼修正①：画面を一番上へスクロール
window.scrollTo({ top: 0, behavior: "auto" });

// ▼修正①：次の未タグ画像へ移動
const next = data.find(l => !l.tags || l.tags.length === 0);

if(next){
  localStorage.setItem("targetComposition", next.id);
  location.reload();
}else{
  // ▼修正：未タグが無くなった場合
  localStorage.removeItem("targetComposition");
  location.reload();
}
}



// ----------------------

function goHome(){
  location.href="home.html";
}

</script>

<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
